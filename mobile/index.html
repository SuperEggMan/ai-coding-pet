<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f2637">
  <link rel="manifest" href="manifest.webmanifest">
  <title>奏 · 会话总览</title>
  <style>
    :root { --ink:#1f2637; --paper:#f7f1e3; --ash:#8f9bb3; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      margin:0; padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 16px);
      background:var(--ink); color:var(--paper);
      font:15px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif;
    }
    header { display:flex; align-items:baseline; gap:8px; padding:14px 2px 10px; }
    h1 { margin:0; font-size:19px; letter-spacing:.5px; }
    #conn { margin-left:auto; font-size:12px; color:var(--ash); }
    #conn[data-up="1"] { color:#5fd0a0; }
    .empty { padding:40px 0; text-align:center; color:var(--ash); font-size:14px; }
    ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
    li {
      padding:11px 12px; border-radius:12px;
      background:rgba(255,255,255,.055);
      border-left:4px solid var(--ash);
    }
    li[data-urgent="1"] { background:rgba(215,56,43,.14); }
    .row1 { display:flex; align-items:center; gap:7px; }
    .proj { font-weight:700; font-size:14.5px; }
    .badge {
      padding:1px 6px; border-radius:4px; font-size:11px; font-weight:700; color:#fff;
    }
    .st { margin-left:auto; font-size:12.5px; font-weight:700; }
    .line { margin:5px 0 0; font-size:13px; color:#d8d2c2;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .cmd { margin:6px 0 0; padding:6px 7px; border-radius:6px; background:rgba(0,0,0,.28);
      font:11.5px/1.4 ui-monospace,Menlo,monospace; color:#f0e6cf; word-break:break-all; }
    .meta { margin:6px 0 0; font-size:11.5px; color:var(--ash); font-variant-numeric:tabular-nums; }
    footer { margin-top:20px; padding:11px 12px; border-radius:10px;
      background:rgba(255,255,255,.04); font-size:12px; color:var(--ash); line-height:1.6; }
    code { font-size:11.5px; color:#c9c2ae; }
  </style>
</head>
<body>
  <header>
    <h1>奏</h1>
    <span id="conn" data-up="0">连接中…</span>
  </header>

  <div id="empty" class="empty">暂无会话</div>
  <ul id="list"></ul>

  <footer>
    当前为<strong>只读镜像</strong>。手机上看得到状态，但不能代你操作机器。<br>
    「按住说话 / 喊名字执行」需要反向下发指令的权限，鉴权做扎实之前不开这个口子 ——
    协议位留在 <code>bridge.js · handleInbound()</code>。
  </footer>

  <script src="app.js"></script>
</body>
</html>
